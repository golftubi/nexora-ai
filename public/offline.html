<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Nexora AI — You're offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080d18;color:#eaf2fb;font:16px/1.6 system-ui,sans-serif}
    main{width:min(100%,440px);padding:32px;border:1px solid #26384d;border-radius:22px;background:#101b2b;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 20px;border:2px solid #51cfe5;border-radius:18px;display:grid;place-items:center;color:#69e0ef;font-size:36px;font-weight:800}
    h1{margin:0 0 12px;font-size:25px}p{color:#b7c5d6;margin:0 0 22px}
    button{border:0;border-radius:12px;padding:13px 20px;background:#087fa5;color:white;font-weight:700;font-size:15px}
  </style>
</head>
<body><main><div class="mark">N</div><h1>You're offline</h1><p>Nexora needs an internet connection to sign in, load conversations and run AI assistants. Reconnect and try again. Your private account data is not stored in this offline page.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
